plugins {
    id 'scala'
    id 'java-library'
}

group = 'com.github.matsu582.fess'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.codelibs.org/repository/maven-releases/' }
}

dependencies {
    // Scala 3 標準ライブラリ
    implementation 'org.scala-lang:scala3-library_3:3.3.3'

    // Fess Crawler (実行時はFessが提供するのでcompileOnly)
    compileOnly('org.codelibs.fess:fess-crawler:15.7.0') {
        transitive = false
    }
    // Fess Crawlerが必要とする最小限のインターフェース
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    compileOnly 'org.apache.tika:tika-core:2.9.2'

    // OLE2解析用 (ver7以降の一太郎ファイル)
    implementation 'org.apache.poi:poi:5.2.5'

    // ログ
    compileOnly 'org.apache.logging.log4j:log4j-api:2.23.1'

    // テスト
    testImplementation 'org.scalatest:scalatest_3:3.2.18'
    testImplementation 'org.scalatestplus:junit-5-10_3:3.2.18.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation('org.codelibs.fess:fess-crawler:15.7.0') {
        transitive = false
    }
    testImplementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    testImplementation 'org.apache.tika:tika-core:2.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
}

tasks.named('test') {
    useJUnitPlatform()
}

// JAR生成設定（依存ライブラリ込みのfat jarを作成）
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // META-INFの重複を除外
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// 通常のJAR（依存なし、Fess環境にPOIがある場合用）
jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Automatic-Module-Name': 'org.codelibs.fess.extractor.ichitaro'
        )
    }
}
